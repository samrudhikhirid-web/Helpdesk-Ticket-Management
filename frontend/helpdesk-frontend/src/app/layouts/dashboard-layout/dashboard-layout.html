<div class="layout">

  <aside class="sidebar">

    <div class="logo">
      <h2>Help Desk</h2>
      <p>Ticket System</p>
    </div>


    <nav class="menu">


      <!-- Common for both -->
      <a routerLink="/profile">
        👤 Profile
      </a>


      <!-- User Menu -->
      <div *ngIf="role === 'User'">

        <a routerLink="/dashboard">
          🏠 Dashboard
        </a>

        <a routerLink="/tickets">
          🎫 My Tickets
        </a>

        <a routerLink="/create-ticket">
          ➕ Create Ticket
        </a>

      </div>



      <!-- Admin Menu -->
      <div *ngIf="role === 'Admin'">

        <a routerLink="/admin-dashboard">
          🏠 Admin Dashboard
        </a>

        <a routerLink="/admin-tickets">
          🎫 Manage Tickets
        </a>

        <a routerLink="/categories">
          📂 Manage Categories
        </a>

      
      </div>

      <a (click)="logout()">
        🚪 Logout
      </a>

    </nav>

  </aside>

  <main class="content">

    <router-outlet></router-outlet>

  </main>


</div>
