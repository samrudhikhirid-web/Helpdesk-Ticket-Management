
<div class="category-page">


    <!-- Header -->

    <div class="page-header">

        <div>
            <h1>
                Manage Categories
            </h1>

            <p>
                Add, update and manage ticket categories
            </p>
        </div>


        <div class="header-icon">
            ⚙️
        </div>

    </div>

    <!-- Add Category Card -->

    <div class="add-card">

        <h2>
            {{editMode ? 'Update Category' : 'Add New Category'}}
        </h2>

        <div class="add-box">

            <input
            type="text"
            placeholder="Enter category name"
            [(ngModel)]="categoryName">

            <button 
            *ngIf="!editMode"
            class="primary-btn"
            (click)="addCategory()">

                Add Category

            </button>

            <button
            *ngIf="editMode"
            class="update-btn"
            (click)="updateCategory()">
                Update Category
            </button>

        </div>

    </div>

    <!-- Category Table -->

    <div class="table-card">

        <div class="table-title">

            <h2>
                Category List
            </h2>

            <span>
                Total: {{categories.length}}
            </span>

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Category Name
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>

                <tbody>

                    <tr *ngFor="let category of categories">

                        <td>
                            {{category.name}}
                        </td>

                        <td>

                            <button
                            class="edit-btn"
                            (click)="editCategory(category)">

                                Edit

                            </button>

                            <button
                            class="delete-btn"
                            (click)="deleteCategory(category._id)">

                                Delete

                            </button>

                        </td>

                    </tr>

                    <tr *ngIf="categories.length===0">

                        <td colspan="2">

                            No categories available

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
