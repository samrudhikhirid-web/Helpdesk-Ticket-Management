<div class="ticket-container">


    <div class="ticket-card">


        <!-- Header -->

        <div class="ticket-header">

            <div class="ticket-icon">
                🎫
            </div>

            <h1>
                Create Ticket
            </h1>

            <p>
                Raise your support request
            </p>

        </div>

        <form 
        [formGroup]="ticketForm"
        (ngSubmit)="submitTicket()">



            <div class="form-group">

                <label>
                    Title
                </label>


                <input
                type="text"
                placeholder="Enter ticket title"
                formControlName="title">


                <small 
                *ngIf="ticketForm.controls.title.invalid &&
                ticketForm.controls.title.touched">

                    Title must contain minimum 5 characters

                </small>


            </div>

            <div class="form-group">


                <label>
                    Description
                </label>


                <textarea
                placeholder="Explain your issue"
                formControlName="description">
                </textarea>


                <small 
                *ngIf="ticketForm.controls.description.invalid &&
                ticketForm.controls.description.touched">

                    Description must contain minimum 10 characters

                </small>

            </div>
           <div class="upload-box">

                <label for="fileUpload" class="upload-btn">
                    📎 Choose Attachment
                </label>
                
                <input 
                id="fileUpload"
                type="file"
                hidden
                (change)="uploadFile($event)">


                <div class="selected-file" *ngIf="selectedFile">

                    <span>
                        📄 {{selectedFile.name}}
                    </span>

                    <button 
                    type="button"
                    class="remove-file"
                    (click)="removeFile()">

                        ✖

                    </button>

                </div>
                 <!-- Image Preview -->

                <div class="preview" *ngIf="imagePreview">

                    <img 
                    [src]="imagePreview"
                    alt="Uploaded file preview">

                </div>

            </div>
            
            <div class="form-group">


                <label>
                    Category
                </label>


                <select formControlName="category">


                    <option value="">
                        Select Category
                    </option>


                    <option
                    *ngFor="let category of categories"
                    [value]="category.name">

                        {{category.name}}

                    </option>


                </select>


            </div>

            <div class="form-group">


                <label>
                    Priority
                </label>


                <select formControlName="priority">


                    <option value="">
                        Select Priority
                    </option>


                    <option value="Low">
                        Low
                    </option>


                    <option value="Medium">
                        Medium
                    </option>


                    <option value="High">
                        High
                    </option>


                </select>


            </div>


            <button type="submit">

                Submit Ticket

            </button>



        </form>


    </div>


</div>
