<div class="login-container">

  <div class="login-card">

    <h1>Help Desk</h1>
    <p class="subtitle">Login to manage your support tickets</p>


    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">


      <div class="form-group">

        <label>Email</label>

        <input 
          type="email"
          placeholder="Enter your email"
          formControlName="email"
        >

        <small *ngIf="loginForm.controls.email.invalid && loginForm.controls.email.touched">
          Enter a valid email address
        </small>

      </div>



      <div class="form-group">

        <label>Password</label>

        <input 
          type="password"
          placeholder="Enter your password"
          formControlName="password"
        >

        <small *ngIf="loginForm.controls.password.invalid && loginForm.controls.password.touched">
          Password is required
        </small>

      </div>



      <button type="submit">
        Login
      </button>


    </form>


    <p class="register-text">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>


  </div>

</div>
