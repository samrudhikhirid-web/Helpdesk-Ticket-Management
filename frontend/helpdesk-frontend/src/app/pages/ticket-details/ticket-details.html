<html>
    <head>
        <title>
            Ticket List
        </title>
    </head>
    <body>
       <div class="details-container">


    <div class="details-card">


        <h1>
            Ticket Details
        </h1>



        <div class="detail-row">

            <label>
                Ticket ID
            </label>

            <span>
                {{ticket.id}}
            </span>

        </div>




        <div class="detail-row">

            <label>
                Title
            </label>

            <span>
                {{ticket.title}}
            </span>

        </div>




        <div class="detail-row">

            <label>
                Description
            </label>

            <span>
                {{ticket.description}}
            </span>

        </div>




        <div class="detail-row">

            <label>
                Category
            </label>

            <span>
                {{ticket.category}}
            </span>

        </div>




        <div class="detail-row">

            <label>
                Priority
            </label>

            <span>
                {{ticket.priority}}
            </span>

        </div>




        <div class="detail-row">

            <label>
                Status
            </label>

            <span>
                {{ticket.status}}
            </span>

        </div>




        <div class="detail-row">

            <label>
                Created By
            </label>

            <span>
                {{ticket.createdBy}}
            </span>

        </div>




        <div class="detail-row">

            <label>
                Assigned To
            </label>

            <span>
                {{ticket.assignedTo}}
            </span>

        </div>




        <div class="detail-row">

            <label>
                Created Date
            </label>

            <span>
                {{ticket.createdDate}}
            </span>

        </div>




        <div class="detail-row">

            <label>
                Last Updated
            </label>

            <span>
                {{ticket.updatedDate}}
            </span>

        </div>



    </div>


</div>
    </body>
        
</html>
